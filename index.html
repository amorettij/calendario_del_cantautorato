<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario del Cantautorato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" id="seasonal-theme" href="">
  <script>
    (function () {
      var d = new Date(), m = d.getMonth() + 1, g = d.getDate(), s;
      if ((m===3&&g>=20)||m===4||m===5||(m===6&&g<=20))       s = 'primavera';
      else if ((m===6&&g>=21)||m===7||m===8||(m===9&&g<=22))  s = 'estate';
      else if ((m===9&&g>=23)||m===10||m===11||(m===12&&g<=20)) s = 'autunno';
      else                                                      s = 'inverno';
      document.getElementById('seasonal-theme').href = 'theme-' + s + '.css';
    })();
  </script>
</head>
<body>

  <!-- HEADER (appare dopo l'hero) -->
  <header class="site-header" id="site-header" aria-hidden="true">
    <div class="header-inner">
      <a href="index.html" class="header-logo">Calendario del Cantautorato</a>
      <nav class="header-nav" aria-label="Navigazione principale">
        <a href="index.html" class="nav-link nav-link--active">Home</a>
        <a href="visualizzazioni.html" class="nav-link">Visualizzazioni</a>
        <a href="about.html" class="nav-link">Progetto</a>
      </nav>
      <span class="header-date" id="header-date"></span>
    </div>
  </header>

  <!-- HERO: roulette della data -->
  <section class="hero" id="hero">
    <div class="hero-noise" aria-hidden="true"></div>

    <!-- Decorazione geometrica anni 70: archi SVG che si tracciano -->
    <svg class="hero-decor" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      <!-- DISCO VINILE — sta prima degli archi così appare sotto -->
      <g class="hdec-vinyl">
        <g class="hdec-vinyl-spin">
          <!-- corpo del disco: cerchio pieno scuro -->
          <circle cx="450" cy="450" r="438" fill="#0c0b09" fill-opacity=".9"/>
          <!-- bordo esterno -->
          <circle cx="450" cy="450" r="438" fill="none" stroke="var(--dark-olive)" stroke-width="2" opacity=".45"/>
          <!-- solchi (dal bordo verso il centro) -->
          <circle cx="450" cy="450" r="418" fill="none" stroke="var(--dark-olive)" stroke-width="1"   opacity=".3"/>
          <circle cx="450" cy="450" r="400" fill="none" stroke="var(--dark-olive)" stroke-width="1.5" opacity=".4"/>
          <circle cx="450" cy="450" r="382" fill="none" stroke="var(--dark-olive)" stroke-width="1"   opacity=".35"/>
          <circle cx="450" cy="450" r="364" fill="none" stroke="var(--dark-olive)" stroke-width="1.5" opacity=".4"/>
          <circle cx="450" cy="450" r="346" fill="none" stroke="var(--dark-olive)" stroke-width="1"   opacity=".3"/>
          <circle cx="450" cy="450" r="328" fill="none" stroke="var(--dark-olive)" stroke-width="1.5" opacity=".38"/>
          <circle cx="450" cy="450" r="310" fill="none" stroke="var(--dark-olive)" stroke-width="1"   opacity=".3"/>
          <circle cx="450" cy="450" r="292" fill="none" stroke="var(--dark-olive)" stroke-width="1.5" opacity=".38"/>
          <circle cx="450" cy="450" r="274" fill="none" stroke="var(--dark-olive)" stroke-width="1"   opacity=".3"/>
          <!-- zona liscia dell'etichetta -->
          <circle cx="450" cy="450" r="108" fill="#111109" fill-opacity=".95"/>
          <!-- buco centrale -->
          <circle cx="450" cy="450" r="10"  fill="#0c0b09"/>
        </g>
      </g>

      <!-- ARCHI — ruotano sopra il disco -->
      <!-- cerchio-guida esterno, sottilissimo -->
      <g class="hdec-arc-wrap hdec-arc-wrap--5">
        <circle cx="450" cy="450" r="440" class="hdec-arc hdec-arc--5"/>
      </g>
      <!-- arco grande mustard 240° -->
      <g class="hdec-arc-wrap hdec-arc-wrap--1">
        <circle cx="450" cy="450" r="400" class="hdec-arc hdec-arc--1" transform="rotate(-120, 450, 450)"/>
      </g>
      <!-- semicerchio teal 180° -->
      <g class="hdec-arc-wrap hdec-arc-wrap--2">
        <circle cx="450" cy="450" r="310" class="hdec-arc hdec-arc--2" transform="rotate(90, 450, 450)"/>
      </g>
      <!-- arco orange-red 300° -->
      <g class="hdec-arc-wrap hdec-arc-wrap--3">
        <circle cx="450" cy="450" r="215" class="hdec-arc hdec-arc--3" transform="rotate(-150, 450, 450)"/>
      </g>
      <!-- arco cream 130° piccolo -->
      <g class="hdec-arc-wrap hdec-arc-wrap--4">
        <circle cx="450" cy="450" r="128" class="hdec-arc hdec-arc--4" transform="rotate(-90, 450, 450)"/>
      </g>

      <!-- Etichetta centrale — statica, sopra tutto -->
      <g class="hdec-vinyl-label">
        <circle cx="450" cy="450" r="90" fill="var(--orange-red)" opacity=".25"/>
        <line x1="450" y1="365" x2="450" y2="378" stroke="var(--cream)" stroke-width="1.5" opacity=".35"/>
        <line x1="450" y1="365" x2="450" y2="378" stroke="var(--cream)" stroke-width="1.5" opacity=".35" transform="rotate(60  450 450)"/>
        <line x1="450" y1="365" x2="450" y2="378" stroke="var(--cream)" stroke-width="1.5" opacity=".35" transform="rotate(120 450 450)"/>
        <line x1="450" y1="365" x2="450" y2="378" stroke="var(--cream)" stroke-width="1.5" opacity=".35" transform="rotate(180 450 450)"/>
        <line x1="450" y1="365" x2="450" y2="378" stroke="var(--cream)" stroke-width="1.5" opacity=".35" transform="rotate(240 450 450)"/>
        <line x1="450" y1="365" x2="450" y2="378" stroke="var(--cream)" stroke-width="1.5" opacity=".35" transform="rotate(300 450 450)"/>
        <circle cx="450" cy="450" r="10" fill="#0c0b09"/>
      </g>

      <!-- tacche/raggi radiali (12 × 30°) sull'anello esterno -->
      <g class="hdec-spoke">
        <line x1="450" y1="10"  x2="450" y2="30"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(30  450 450)"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(60  450 450)"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(90  450 450)"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(120 450 450)"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(150 450 450)"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(180 450 450)"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(210 450 450)"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(240 450 450)"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(270 450 450)"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(300 450 450)"/>
        <line x1="450" y1="10"  x2="450" y2="30" transform="rotate(330 450 450)"/>
      </g>
      <!-- punto centrale -->
      <circle cx="450" cy="450" r="9" class="hdec-center"/>
    </svg>
    <div class="hero-content">
      <p class="hero-eyebrow">Oggi</p>
      <div class="roulette-wrap" id="roulette-wrap" aria-label="Data corrente animata">
        <div class="roulette-slot" id="slot-day" aria-label="Giorno">
          <div class="slot-mask slot-mask--top" aria-hidden="true"></div>
          <div class="roulette-track" id="track-day"></div>
          <div class="slot-mask slot-mask--bottom" aria-hidden="true"></div>
        </div>
        <div class="roulette-slot roulette-slot--month" id="slot-month" aria-label="Mese">
          <div class="slot-mask slot-mask--top" aria-hidden="true"></div>
          <div class="roulette-track" id="track-month"></div>
          <div class="slot-mask slot-mask--bottom" aria-hidden="true"></div>
        </div>
        <div class="roulette-slot roulette-slot--year" id="slot-year" aria-label="Anno">
          <div class="slot-mask slot-mask--top" aria-hidden="true"></div>
          <div class="roulette-track" id="track-year"></div>
          <div class="slot-mask slot-mask--bottom" aria-hidden="true"></div>
        </div>
      </div>
      <a href="#songs-container" class="hero-cta" aria-label="Scopri le canzoni di oggi">
        <span>Scopri le canzoni</span>
        <span class="cta-arrow" aria-hidden="true"></span>
      </a>
    </div>
  </section>

  <!-- CANZONI generate dinamicamente -->
  <main id="songs-container" aria-live="polite">

    <div class="loading-state" id="loading-indicator" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>Caricamento in corso…</p>
    </div>

  </main>

  <!-- FALLBACK: nessuna canzone per oggi -->
  <div class="empty-state hidden" id="no-songs" role="status">
    <div class="empty-state__icon" aria-hidden="true">♩</div>
    <h2 class="empty-state__title">Nessuna canzone per oggi</h2>
    <p class="empty-state__desc">
      Il calendario non contiene canzoni per questa data.<br>
      Torna a trovarci domani.
    </p>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>© 2026 Calendario del Cantautorato</p>
  </footer>

  <script src="js/roulette.js"></script>
  <script src="js/player.js"></script>
  <script src="js/scroll.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
